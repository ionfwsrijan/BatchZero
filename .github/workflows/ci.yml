name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks out the repo, so it never needs write access.
permissions:
  contents: read

# Superseded runs on the same ref are pointless (and burn free runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (tests against live FalkorDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed graph
        working-directory: backend
        run: python -m batchzero.seed --reset
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  container:
    name: container (deploy image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The Render deployment ships deploy/Dockerfile, so a broken build must
      # fail CI rather than the live service. Nothing is pushed to a registry.
      - name: Build single-container image
        run: docker build -f deploy/Dockerfile -t batchzero:ci .
