# Render blueprint — BatchZero as a single free web service.
#
# One container runs FalkorDB + the FastAPI agent + the compiled UI (see
# deploy/Dockerfile), so there is no external database to attach. Free instances
# spin down after 15 minutes idle and cold-start on the next request; the
# container reseeds the fixture on every boot.
#
# Apply with: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: batchzero
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: TENANT_GRAPH
        value: pmph_ops
      - key: TRAINING_TENANT_GRAPH
        value: training_academy
      - key: PYTHONUNBUFFERED
        value: "1"
